<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Satymev Group</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        /* Presentation wrapper */

        .presentation {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        /* Slides */

        .presentation-slide {
            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;

            opacity: 0;
            visibility: hidden;

            transition:
                opacity 0.8s ease,
                visibility 0.8s ease;
        }

        .presentation-slide.active {
            opacity: 1;
            visibility: visible;
            z-index: 2;
        }

        .presentation-slide img {
            width: 100%;
            height: 100%;

            display: block;

            object-fit: cover;
        }


        /* Optional overlay */

        .presentation-overlay {
            position: absolute;
            inset: 0;

            pointer-events: none;

            background: rgba(0, 0, 0, 0.05);

            z-index: 10;
        }


        /* Slide counter */

        .presentation-counter {
            position: fixed;

            right: 30px;
            bottom: 30px;

            z-index: 20;

            color: #fff;

            font-family: Arial, sans-serif;
            font-size: 14px;
            letter-spacing: 1px;
        }


        /* Navigation dots */

        .presentation-dots {
            position: fixed;

            left: 30px;
            top: 50%;

            transform: translateY(-50%);

            z-index: 20;

            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .presentation-dot {
            width: 8px;
            height: 8px;

            border-radius: 50%;

            border: 0;

            padding: 0;

            background: rgba(255,255,255,0.4);

            cursor: pointer;

            transition: 0.3s ease;
        }

        .presentation-dot.active {
            height: 25px;
            border-radius: 10px;
            background: #fff;
        }


        /* Mobile */

        @media (max-width: 767px) {

            .presentation-counter {
                right: 15px;
                bottom: 15px;
            }

            .presentation-dots {
                left: 15px;
            }

        }

    </style>
</head>

<body>


<div class="presentation">

    <!-- Slides will be generated here -->
    <div class="presentation-slides"></div>

    <div class="presentation-overlay"></div>


    <!-- Dots -->
    <div class="presentation-dots"></div>


    <!-- Counter -->
    <div class="presentation-counter">
        <span class="current-slide">01</span>
        /
        <span class="total-slides">00</span>
    </div>

</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
    $(document).ready(function () {
        var slides = [
            'assets/images/presentation-01.jpg',
            'assets/images/presentation-02.jpg',
            'assets/images/presentation-03.jpg',
            'assets/images/presentation-04.jpg',
            'assets/images/presentation-05.jpg',
            'assets/images/presentation-06.jpg',
            'assets/images/presentation-07.jpg',
            'assets/images/presentation-08.jpg',
            'assets/images/presentation-09.jpg',
            'assets/images/presentation-10.jpg',
            'assets/images/presentation-11.jpg',
            'assets/images/presentation-12.jpg',
            'assets/images/presentation-13.jpg',
            'assets/images/presentation-14.jpg',
            'assets/images/presentation-15.jpg',
            'assets/images/presentation-16.jpg',
            'assets/images/presentation-17.jpg',
            'assets/images/presentation-18.jpg',
            'assets/images/presentation-19.jpg',
            'assets/images/presentation-20.jpg',
            'assets/images/presentation-21.jpg',
            'assets/images/presentation-22.jpg',
            'assets/images/presentation-23.jpg',
            'assets/images/presentation-24.jpg',
            'assets/images/presentation-25.jpg',
            'assets/images/presentation-26.jpg',
            'assets/images/presentation-27.jpg',
            'assets/images/presentation-28.jpg',
            'assets/images/presentation-29.jpg'
        ];

        var currentIndex = 0;
        var isAnimating = false;
        var animationDuration = 400;
        var totalSlides = slides.length;

        $('.total-slides').text(
            String(totalSlides).padStart(2, '0')
        );

        $.each(slides, function (index, image) {
            var activeClass = index === 0 ? 'active' : '';
            $('.presentation-slides').append(
                '<div class="presentation-slide ' + activeClass + '" data-index="' + index + '">' +
                    '<img src="' + image + '" alt="Presentation slide ' + (index + 1) + '">' +
                '</div>'
            );
        });


        $.each(slides, function (index) {
            var activeClass = index === 0 ? 'active' : '';
            $('.presentation-dots').append(
                '<button ' +
                    'type="button" ' +
                    'class="presentation-dot ' + activeClass + '" ' +
                    'data-index="' + index + '"' +
                '></button>'
            );
        });

        var $slides = $('.presentation-slide');
        var $dots = $('.presentation-dot');

        function showSlide(index) {
            if (isAnimating) {
                return;
            }

            if (index < 0) {
                index = 0;
            }

            if (index >= totalSlides) {
                index = totalSlides - 1;
            }

            if (index === currentIndex) {
                return;
            }


            isAnimating = true;



            $slides
                .eq(currentIndex)
                .removeClass('active');


        

            $slides
                .eq(index)
                .addClass('active');
            $dots.removeClass('active');
            $dots
                .eq(index)
                .addClass('active');
            $('.current-slide').text(
                String(index + 1).padStart(2, '0')
            );

            currentIndex = index;
            setTimeout(function () {
                isAnimating = false;
            }, animationDuration);
        }

        $(window).on('wheel', function (event) {
            if (isAnimating) {
                return;
            }
            var delta = event.originalEvent.deltaY;
            if (delta > 0) {
                // Scroll DOWN
                showSlide(currentIndex + 1);
            } else if (delta < 0) {
                // Scroll UP
                showSlide(currentIndex - 1);
            }
        });


        $dots.on('click', function () {
            var index = parseInt(
                $(this).attr('data-index')
            );
            showSlide(index);
        });

        $(document).on('keydown', function (event) {
            if (event.key === 'ArrowDown' || event.key === 'ArrowRight') {
                showSlide(currentIndex + 1);
            }

            if (event.key === 'ArrowUp' || event.key === 'ArrowLeft') {
                showSlide(currentIndex - 1);
            }
        });
    });
</script>

</body>
</html>
